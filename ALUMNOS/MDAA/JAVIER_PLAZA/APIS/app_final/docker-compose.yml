services:
  bbdd:
    image: postgres:17-alpine
    env_file: .env
    container_name: bbdd
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: 
      context: ./API
      dockerfile: Dockerfile
    image: api:latest
    container_name: api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      bbdd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 5000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  post:
    build:
      context: ./X_post
      dockerfile: Dockerfile
    image: post:latest
    container_name: post
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
  ingestion:
    build: 
      context: ./ingestion
      dockerfile: Dockerfile
    image: ingestion:latest
    container_name: ingestion
    env_file:
      - .env  
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data: