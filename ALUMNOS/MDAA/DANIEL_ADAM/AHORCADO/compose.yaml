version: "3.9"

services:

  db:
    image: postgres:15
    container_name: ahorcado-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt && python ahorcado.py"
    volumes:
      - ./:/app
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data:

