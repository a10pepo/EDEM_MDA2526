services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - postgresDB:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    command: >
      sh -c "pip install --upgrade pip &&pip install -r requirements.txt && python -u ahorcado.py palabras.txt"
    depends_on:
      - db

volumes:
  pg_data:
  postgresDB: