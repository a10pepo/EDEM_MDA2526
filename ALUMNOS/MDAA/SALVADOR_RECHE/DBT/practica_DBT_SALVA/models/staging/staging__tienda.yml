version: 2

sources:
  - name: tienda_pesca
    description: "Archivos CSV exportados del sistema ERP (La Potera Feliz)"
    # En un entorno productivo real, aquí configuraríamos 'external_tables'
    # Para este ejercicio con Docker, usaremos rutas directas en el SQL.
    tables:
      - name: raw__ventas
        description: "Lineas de ticket de venta sin procesar"
      - name: raw__capturas
        description: "Log de capturas reportadas por clientes"
      - name: raw__articulos
        description: "Maestro de productos"
      - name: raw__clientes
        description: "Cartera de clientes"
      - name: raw__pedidos_stock
        description: "Pedidos a proveedores"