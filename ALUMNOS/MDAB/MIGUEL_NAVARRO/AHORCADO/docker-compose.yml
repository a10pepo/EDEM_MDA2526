services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgresDB:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgresDB:
