services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    image: python:3.11-slim
    working_dir: /app
    build: .
    env_file: .env
    command: >
      sh -c "pip install -r requirements.txt && python valenbisi_collector.py"
    depends_on:
      - db              # or postgres
