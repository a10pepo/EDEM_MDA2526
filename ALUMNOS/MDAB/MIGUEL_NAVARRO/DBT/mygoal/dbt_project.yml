name: mygoal

profile: mygoal_db

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  mygoal:
    +schema: raw
    players:
      +column_types:
        dateOfBirth: varchar

models:
  mygoal:
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +tags: ["intermediate"]
    marts:
      +materialized: table
