services:

  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    command: >
      sh -c "pip install -r requirements.txt && python main.py"

  frontend:
    image: python:3.11-slim
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    env_file:
      - .env
    command: sh -c "pip install -r requirements.txt && streamlit run app.py"

volumes:
  workouts_data:
