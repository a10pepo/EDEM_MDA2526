version: '3.8'

services:

  db:
    image: postgres:15
    container_name: valenbisi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: valenbisi_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: valenbisi_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - db


  collector:
    build: .
    container_name: valenbisi_script
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: valenbisi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123

volumes:
  pg_data:

  