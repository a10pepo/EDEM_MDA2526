services:
  db:
    image: postgres:16
    container_name: valenbisi_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valenbisi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  collector:
    build: .
    container_name: valenbisi_collector
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: valenbisi_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

volumes:
  pgdata:


 

