version: '3.9'

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:   # añadimos para garantizar creación de DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pruebadb
    volumes:
      - postgresDB:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    restart: unless-stopped

  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    command: >
      sh -c "pip install -r requirements.txt && python -u ahorcado.py palabras.txt"
    depends_on:
      - db

volumes:
  postgresDB:
