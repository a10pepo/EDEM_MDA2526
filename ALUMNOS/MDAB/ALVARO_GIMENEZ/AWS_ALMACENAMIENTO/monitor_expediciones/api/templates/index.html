<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Expediciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { background-color: #f0f2f5; font-family: system-ui, sans-serif; }
    .navbar { background-color: #1a2e4a; }
    .kpi-card { border-left: 4px solid; border-radius: 8px; transition: box-shadow .2s; }
    .kpi-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .kpi-card.blue  { border-color: #0d6efd; }
    .kpi-card.green { border-color: #198754; }
    .kpi-card.amber { border-color: #fd7e14; }
    .kpi-value { font-size: 2.4rem; font-weight: 700; line-height: 1.1; }
    .kpi-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .section-card { border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); border: none; }
    .chart-wrapper { position: relative; height: 260px; }
    #last-update { font-size: .82rem; }
    .table td, .table th { vertical-align: middle; white-space: nowrap; }
    .badge-cat { font-size: .72rem; font-weight: 500; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold fs-5">&#128230; Monitor de Expediciones de Almacén</span>
    <span id="last-update" class="text-light"></span>
  </div>
</nav>

<div class="container-fluid px-4">

  <!-- KPIs -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card kpi-card blue p-3 bg-white">
        <div class="kpi-label text-muted mb-2">Transacciones (24h)</div>
        <div class="kpi-value text-primary" id="kpi-tx">—</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi-card green p-3 bg-white">
        <div class="kpi-label text-muted mb-2">Unidades Expedidas (24h)</div>
        <div class="kpi-value text-success" id="kpi-units">—</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card kpi-card amber p-3 bg-white">
        <div class="kpi-label text-muted mb-2">Clientes Únicos (24h)</div>
        <div class="kpi-value text-warning" id="kpi-clients">—</div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row g-3 mb-4">
    <div class="col-lg-6">
      <div class="card section-card p-3 bg-white h-100">
        <h6 class="fw-semibold mb-3">Top 5 Productos por Unidades</h6>
        <div class="chart-wrapper">
          <canvas id="chartProductos"></canvas>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card section-card p-3 bg-white h-100">
        <h6 class="fw-semibold mb-3">Top 5 Clientes por Volumen</h6>
        <div class="chart-wrapper">
          <canvas id="chartClientes"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Transactions table -->
  <div class="card section-card p-3 bg-white mb-4">
    <h6 class="fw-semibold mb-3">Últimas 20 Transacciones</h6>
    <div class="table-responsive">
      <table class="table table-sm table-hover">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Cliente</th>
            <th>Empresa</th>
            <th class="text-end">Cantidad</th>
            <th>Fecha Expedición</th>
          </tr>
        </thead>
        <tbody id="tx-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const COLORS_BLUE  = ['#0d6efd','#3d8bfd','#6ea8fe','#9ec5fe','#cfe2ff'];
  const COLORS_GREEN = ['#198754','#2fa862','#5cb87a','#86cfa0','#b7e1c8'];

  let chartProductos, chartClientes;

  function buildBarChart(canvasId, labels, data, colors) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors, borderRadius: 4, borderSkipped: false }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, grid: { color: '#f0f0f0' } },
          y: { grid: { display: false } }
        },
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  async function loadMetrics() {
    const res = await fetch('/api/metrics');
    const d   = await res.json();

    document.getElementById('kpi-tx').textContent     = d.total_transacciones.toLocaleString('es-ES');
    document.getElementById('kpi-units').textContent   = d.total_unidades.toLocaleString('es-ES');
    document.getElementById('kpi-clients').textContent = d.clientes_unicos.toLocaleString('es-ES');

    const pLabels = d.top_productos.map(r => r.nombre);
    const pData   = d.top_productos.map(r => r.total);
    const cLabels = d.top_clientes.map(r => r.nombre);
    const cData   = d.top_clientes.map(r => r.total);

    if (chartProductos) {
      chartProductos.data.labels = pLabels;
      chartProductos.data.datasets[0].data = pData;
      chartProductos.update();
    } else {
      chartProductos = buildBarChart('chartProductos', pLabels, pData, COLORS_BLUE);
    }

    if (chartClientes) {
      chartClientes.data.labels = cLabels;
      chartClientes.data.datasets[0].data = cData;
      chartClientes.update();
    } else {
      chartClientes = buildBarChart('chartClientes', cLabels, cData, COLORS_GREEN);
    }
  }

  async function loadTransactions() {
    const res  = await fetch('/api/transactions');
    const rows = await res.json();
    const tbody = document.getElementById('tx-tbody');
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td class="text-muted small">${r.id}</td>
        <td>${r.producto}</td>
        <td><span class="badge bg-secondary badge-cat fw-normal">${r.categoria}</span></td>
        <td>${r.cliente}</td>
        <td class="text-muted small">${r.empresa}</td>
        <td class="text-end fw-semibold">${r.cantidad}</td>
        <td class="text-muted small">${r.fecha_expedicion}</td>
      </tr>`).join('');
  }

  async function refresh() {
    await Promise.all([loadMetrics(), loadTransactions()]);
    document.getElementById('last-update').textContent =
      'Actualizado: ' + new Date().toLocaleTimeString('es-ES');
  }

  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
