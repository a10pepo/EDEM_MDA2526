services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5431:5432"
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: valenbisi:latest
    working_dir: /app            
    environment:
      - PYTHONUNBUFFERED=1  # Para que los print salgan directamente por consolta

    env_file: .env
    depends_on:
      - db  