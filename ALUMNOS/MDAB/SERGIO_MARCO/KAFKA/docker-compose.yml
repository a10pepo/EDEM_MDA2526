services:

  # =============================
  # Servicio Zookeeper
  # =============================
  # Zookeeper es necesario para coordinar los brokers de Kafka.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181  # Puerto donde Zookeeper escucha
      ZOOKEEPER_TICK_TIME: 2000    # Intervalo de tiempo interno
    ports:
      - "2181:2181"                # Exponemos el puerto para acceso local
    networks:
      - kafka-net

  # =============================
  # Servicio Kafka
  # =============================
  # Broker principal de Kafka. Aquí configuramos dos listeners:
  # - localhost: para clientes en la máquina local
  # - kafka: para clientes dentro de la red Docker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"                # Puerto para clientes locales
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listener para aceptar conexiones en todas las interfaces
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      # Advertised listeners: cómo se anuncia el broker a los clientes
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      # Mapeo de protocolos
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      # Listener interno para comunicación entre brokers
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    # Healthcheck: verifica que el broker responde antes de declararse "healthy"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net

  # =============================
  # Servicio Init Kafka
  # =============================
  # Crea el topic "inventory_raw" y "inventory_enriched" automaticamente al arrancar.
  # Espera a que Kafka este healthy y luego ejecuta el comando.
  init-kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Creando topics...'
      kafka-topics --create --topic inventory_raw --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092
      echo 'Topic inventory_raw creado!'
      kafka-topics --create --topic inventory_enriched --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:29092
      echo 'Topic inventory_enriched creado!'
      "
    networks:
      - kafka-net

  # =============================
  # Servicio Producer
  # =============================
  # Consulta productos aleatorios de DummyJSON y los envia al topic inventory_raw.
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - kafka-net

  # =============================
  # Servicio Consumer
  # =============================
  # Lee de inventory_raw, enriquece los datos y los envia a inventory_enriched.
  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - kafka-net

  # =============================
  # Servicio Control Center
  # =============================
  # Interfaz web para gestionar Kafka.
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.3.0
    container_name: control-center
    depends_on:
      - kafka
    ports:
      - "9021:9021"                # Puerto para acceder a la UI
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_ZOOKEEPER_CONNECT: zookeeper:2181
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
    networks:
      - kafka-net

  # =============================
  # Servicio KSQL
  # =============================
  # Motor para ejecutar consultas SQL sobre datos en Kafka.
  ksql:
    image: confluentinc/cp-ksqldb-server:7.3.0
    container_name: ksql
    depends_on:
      - kafka
    ports:
      - "8088:8088"                # Puerto para la API REST de KSQL
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:29092  # Conexion al broker Kafka
      KSQL_LISTENERS: http://0.0.0.0:8088  # Direccion donde escucha KSQL
      KSQL_KSQL_SERVICE_ID: ksql_service   # Identificador del servicio KSQL
    # Healthcheck: verifica que ksqlDB responde antes de declararse "healthy"
    healthcheck:
      test: curl -f http://localhost:8088/info || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kafka-net

  # =============================
  # Servicio KSQL CLI
  # =============================
  # Cliente para ejecutar comandos KSQL desde la linea de comandos.
  ksql-cli:
    image: confluentinc/cp-ksqldb-cli:7.3.0
    container_name: ksql-cli
    depends_on:
      - ksql
    entrypoint: /bin/sh   # Para que puedas entrar al contenedor y ejecutar comandos
    tty: true             # Permite sesion interactiva
    networks:
      - kafka-net

  # =============================
  # Servicio KSQL Setup
  # =============================
  # Envia las queries KSQL al servidor ksqlDB para crear los streams.
  # 1. Crea un STREAM sobre el topic inventory_enriched (datos enriquecidos)
  # 2. Crea un STREAM AS SELECT que filtra en streaming los productos con
  #    stock < 10 y category_value = 'High', y los envia al topic inventory_alerts.
  # Este servicio se ejecuta una vez (envia las queries) y termina.
  # El servidor ksql es el que mantiene las queries corriendo en streaming.
  ksql-setup:
    image: confluentinc/cp-ksqldb-cli:7.3.0
    container_name: ksql-setup
    depends_on:
      ksql:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Creando streams KSQL...'

      ksql http://ksql:8088 <<EOF
      CREATE STREAM inventory_enriched_stream (
        id INT,
        title VARCHAR,
        price DOUBLE,
        stock INT,
        category_value VARCHAR
      ) WITH (
        KAFKA_TOPIC='inventory_enriched',
        VALUE_FORMAT='JSON'
      );

      CREATE STREAM inventory_alerts_stream
        WITH (KAFKA_TOPIC='inventory_alerts', VALUE_FORMAT='JSON')
        AS SELECT
          id,
          title,
          price,
          stock,
          category_value
        FROM inventory_enriched_stream
        WHERE stock < 10 AND category_value = 'High'
        EMIT CHANGES;
      EOF

      echo 'Streams KSQL creados!'
      "
    networks:
      - kafka-net

  # =============================
  # Servicio Consumer Alerts
  # =============================
  # Lee del topic inventory_alerts (filtrado por KSQL) e imprime las alertas por pantalla.
  consumer-alerts:
    build: ./consumer-alerts
    container_name: consumer-alerts
    depends_on:
      ksql-setup:
        condition: service_completed_successfully
    networks:
      - kafka-net

# =============================
# Red interna para comunicacion entre contenedores
# =============================
networks:
  kafka-net:
    driver: bridge