apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: delivery-fleet-simulator:latest
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: "REPLACE_DB_HOST"
            - name: DB_PORT
              value: "REPLACE_DB_PORT"
            - name: DB_NAME
              value: "REPLACE_DB_NAME"
            - name: DB_USER
              value: "REPLACE_DB_USER"
            - name: DB_PASSWORD
              value: "REPLACE_DB_PASSWORD"
