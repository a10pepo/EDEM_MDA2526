version: 2

models:
  # --- Capa Staging (Limpieza) ---
  - name: staging_results
    description: "Cleaned list of international matches from history."
    columns:
      - name: match_date
        tests: [not_null]
      - name: home_team
        tests: [not_null]
      - name: away_team
        tests: [not_null]

  - name: staging_goalscorers
    description: "Granular data of every goal scored, including penalties and own goals."
    columns:
      - name: match_date
        tests: [not_null]
      - name: scorer
        description: "Name of the player who scored."

  - name: staging_shootouts
    description: "Matches that ended in a penalty shootout."
    columns:
      - name: match_date
        tests: [not_null]
      - name: winner
        tests: [not_null]

  # --- Capa Marts (Negocio) ---
  - name: top_scorers
    description: "Ranking table showing the top goalscorers in history."
    columns:
      - name: player_name
        description: "Name of the player."
        tests: [not_null]
      - name: total_goals
        description: "Total goals scored (excluding own goals)."
      - name: penalty_goals
        description: "Number of goals scored from penalty kicks."

  - name: team_stats
    description: "Aggregated performance stats for every national team."
    columns:
      - name: team
        description: "Country name."
        tests: [unique, not_null] 
      - name: total_wins
        description: "Total victories (Home + Away)."
      - name: total_goals
        description: "Total goals scored in history."