services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgresDB:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  app:
    build: . #we put a "." so docker builds the image using the Dockerfile 
    working_dir: /app
    volumes:
    - ./:/app
    env_file: 
    - .env
    depends_on:
      - db
      
volumes:
  postgresDB: