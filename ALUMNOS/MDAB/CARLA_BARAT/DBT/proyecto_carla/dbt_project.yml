# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'proyecto_carla'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'proyecto_carla'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# ==========================================================
# SECCIÓN DE CONFIGURACIÓN DE MODELOS (Aquí están los cambios)
# ==========================================================
models:
  proyecto_carla:
    # Esta configuración se aplica a todos los modelos directamente en models/example/
    example:
      +schema: main # Asegúrate de que este sea el esquema correcto (main para DuckDB)

      # 1. Configuración de la capa Staging (Stg_drivers, Stg_races, Stg_results)
      # Asumo que tus modelos stg_* están directamente bajo models/example/ o models/example/staging/
      +materialized: view 
      
      # 2. Configuración de la capa Intermediate (int_race_results_joined)
      # Esto permite a dbt escanear la subcarpeta 'Intermediate'
      Intermediate:
        +materialized: view # Los modelos intermedios suelen ser VISTAS
        
      # 3. Configuración de la capa Marts (dim_*, fact_*)
      # Esto permite a dbt escanear la subcarpeta 'Marts'
      Marts:
        +materialized: table # Las tablas de Marts suelen ser TABLAS (más eficientes para consultas BI)