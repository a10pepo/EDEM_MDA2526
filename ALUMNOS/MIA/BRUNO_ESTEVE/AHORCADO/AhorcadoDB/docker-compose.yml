services:
  ahorcado_db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgresDB:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    restart: unless-stopped

  app:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    command: sh -c "pip install -r requirements.txt && python ahorcadodb.py"
    depends_on:
      - ahorcado_db

volumes:
  postgresDB: