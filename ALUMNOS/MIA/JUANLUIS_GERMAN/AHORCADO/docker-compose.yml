services:
  ahorcado_db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - postgresDB:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    restart: unless-stopped

  ahorcado:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    command: > 
          sh -c "apt-get update &&
          apt-get install -y libpq-dev &&
          pip install -r requirements.txt &&
          python ahorcado.py"
    depends_on:
      - ahorcado_db

volumes: 
  postgresDB:
