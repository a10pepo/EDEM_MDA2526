version: '3.8'

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - ./postgresDB:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: "no"

  ahorcado:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env
    command: > 
          sh -c "apt-get update &&
          pip install -r requirements.txt &&
          python ahorcado.py"
    depends_on:
      - db
    restart: "no"
