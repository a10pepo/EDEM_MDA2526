version: '3.8'

services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - ./postgresDB:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: "no"

  ahorcado:
    build:
      context: .
      dockerfile: Dockerfile
    image: ahorcado:latest
    env_file: .env
    volumes:
      - ./palabras.txt:/app/palabras.txt
    depends_on:
      - db
    restart: "no"
