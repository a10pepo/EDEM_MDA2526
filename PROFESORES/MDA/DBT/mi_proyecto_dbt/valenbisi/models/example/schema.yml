version: 2

seeds:
  - name: valenbisi
    description: "Datos originales de Valenbisi descargados de la API"
    columns:
      - name: station_id
        description: "ID de la estación de bicicletas"
      - name: station_name
        description: "Nombre de la estación"
      - name: available_bikes
        description: "Número de bicicletas disponibles"
      - name: available_bike_stands
        description: "Número de espacios libres en la estación"
      - name: state_station
        description: "Indica si la estación está abierta (True/False)"
      - name: total_capacity
        description: "Capacidad total de la estación"
      - name: time
        description: "Fecha y hora de la medición"

models:
  - name: availability
    description: "Tabla con disponibilidad actual de bicicletas por estación"
    columns:
      - name: station_id
        description: "ID de la estación"
      - name: station_name
        description: "Nombre de la estación"
      - name: available_bikes
        description: "Número de bicicletas disponibles"
      - name: available_bike_stands
        description: "Número de espacios libres en la estación"
      - name: state_station
        description: "Indica si la estación está abierta (True/False)"
      - name: total_capacity
        description: "Capacidad total de la estación"
      - name: time
        description: "Fecha y hora de la medición"

  - name: hourly_summary
    description: "Resumen de disponibilidad de bicicletas agrupado por hora"
    columns:
      - name: hour
        description: "Hora de la medición"
      - name: total_bikes
        description: "Total de bicicletas disponibles en todas las estaciones"
      - name: total_free_stands
        description: "Total de espacios libres en todas las estaciones"

  - name: station_occupancy
    description: "Porcentaje de ocupación de cada estación"
    columns:
      - name: station_id
        description: "ID de la estación"
      - name: station_name
        description: "Nombre de la estación"
      - name: available_bikes
        description: "Número de bicicletas disponibles"
      - name: total_capacity
        description: "Capacidad total de la estación"
      - name: occupancy_percent
        description: "Porcentaje de ocupación calculado como (bicis disponibles / capacidad total) * 100"
      - name: time
        description: "Fecha y hora de la medición"

